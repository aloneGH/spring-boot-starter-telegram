server.address=127.0.0.1
spring.telegram.client.api-id=${TELEGRAM_API_ID}
spring.telegram.client.api-hash=${TELEGRAM_API_HASH}
spring.telegram.client.phone=${TELEGRAM_API_PHONE}
spring.telegram.client.database-encryption-key=${TELEGRAM_API_DATABASE_ENCRYPTION}
spring.telegram.client.system-language-code=en
spring.telegram.client.device-model=${DEVICE_MODEL}
spring.telegram.client.use-message-database=false
spring.telegram.client.use-file-database=true
spring.telegram.client.use-chat-info-database=true
spring.telegram.client.use-secret-chats=false
spring.telegram.client.log-verbosity-level=1
spring.telegram.client.database-directory=${DATABASE_DIR}
spring.telegram.client.files-directory=${FILES_DIR}
spring.mvc.async.request-timeout=60000
app.security.api-keys=${API_KEYS}

# =========================
# SQLite 业务库配置（1GB 内存 / WAL 并发调优）
# =========================
spring.datasource.url=jdbc:sqlite:${DATABASE_DIR}/sqlite.db?journal_mode=WAL&busy_timeout=15000&synchronous=NORMAL&foreign_keys=ON&transaction_mode=IMMEDIATE
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1

# =========================
# 音乐同步、转码、存储与歌词配置（8GB 磁盘 / 海外 VPS 定制）
# =========================
music.sync=${MUSIC_SYNC:true}
music.sync.folder-name=${MUSIC_FOLDER_NAME:Music}
music.sync.MusicSource=${MUSIC_SOURCE_FOLDER_NAME:Music-Source}

# 固定私有仓库频道（优先用 chat-id；为 0 时按 channel-title 自动查找或创建）
music.storage.chat-id=${STORAGE_CHAT_ID:0}
music.storage.channel-title=${STORAGE_CHANNEL_TITLE:CW-Music-Vault}

# 转码策略：无损转 192k VBR Opus，普通有损 <=15MB 且响度正常原样直通
music.transcode.opus-bitrate=${OPUS_BITRATE:192k}
music.transcode.lossy-reencode-threshold-mb=${LOSSY_REENCODE_THRESHOLD_MB:15}

# EBU R128 两遍线性响度归一化（手机端/桌面端全兼容，目标 -14 LUFS）
music.loudness.enabled=${LOUDNESS_ENABLED:true}
music.loudness.target-lufs=${LOUDNESS_TARGET_LUFS:-14.0}
music.loudness.true-peak=${LOUDNESS_TRUE_PEAK:-1.5}
music.loudness.lra=${LOUDNESS_LRA:11.0}
music.loudness.lossy-tolerance-db=${LOUDNESS_LOSSY_TOLERANCE_DB:2.5}
music.loudness.legacy-backfill-enabled=${LOUDNESS_LEGACY_BACKFILL_ENABLED:true}
music.loudness.legacy-tolerance-db=${LOUDNESS_LEGACY_TOLERANCE_DB:3.0}
music.loudness.legacy-batch-size=${LOUDNESS_LEGACY_BATCH_SIZE:2}

# 8GB 磁盘护栏配置
music.cache.max-bytes=${MUSIC_CACHE_MAX_BYTES:1073741824}
music.cache.max-files=${MUSIC_CACHE_MAX_FILES:120}
music.cache.ttl-seconds=${MUSIC_CACHE_TTL_SECONDS:86400}
music.cover.dir=${FILES_DIR}/covers
music.cover.max-bytes=${MUSIC_COVER_MAX_BYTES:314572800}
music.temp.dir=${FILES_DIR}/tmp

# 海外 VPS 歌词源（内嵌优先 -> LRCLIB -> 网易云兜底，可配反代/代理）
music.lyric.lrclib-base-url=${LRCLIB_BASE_URL:https://lrclib.net}
music.lyric.netease-base-url=${NETEASE_BASE_URL:https://music.163.com}
music.lyric.proxy-url=${LYRIC_PROXY_URL:}

# =========================
# 日志与本地缓存（1GB 内存 / 8GB 磁盘收紧）
# =========================
logging.file.path=${LOG_DIR}
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=3
logging.logback.rollingpolicy.total-size-cap=25MB
spring.cache.cache-names=music_list
spring.cache.caffeine.spec=initialCapacity=32,maximumSize=150,expireAfterWrite=5m
